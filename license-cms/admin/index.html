<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iCashbox — точки</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">iCashbox Control</span><h1>Торговые точки</h1><p>Ключи, срок действия и активные кассы.</p></div><button class="primary" id="add">+ Добавить точку</button></header><section class="settings"><label>Токен администратора <input id="token" type="password" placeholder="ADMIN_TOKEN"></label><button id="connect">Подключиться</button></section><section id="summary" class="summary"></section><section id="cards" class="cards"><div class="empty">Введите токен администратора, чтобы увидеть точки.</div></section></main>
<dialog id="pointDialog"><form id="pointForm"><div class="modal-head"><h2 id="formTitle">Новая точка</h2><button type="button" class="icon" id="close">×</button></div><input type="hidden" id="id"><label>Название точки <input id="name" required maxlength="200" placeholder="Кафе на Рудаки"></label><label>Адрес <input id="address" maxlength="200" placeholder="пр. Рудаки, 12"></label><label>Контакт <input id="contact" maxlength="200" placeholder="+992 …"></label><div class="two"><label>Лицензия до <input id="expiresAt" type="date" required></label><label>Лимит касс <input id="maxActivations" type="number" min="1" max="50" value="1" required></label></div><label class="checkbox"><input id="status" type="checkbox" checked> Точка активна</label><div class="actions"><button type="button" id="cancel">Отмена</button><button class="primary" id="save">Сохранить</button></div></form></dialog>
<dialog id="keyDialog"><section><div class="modal-head"><h2>Новый ключ лицензии</h2><button type="button" class="icon" id="closeKey">×</button></div><p>Скопируйте ключ сейчас: позднее его нельзя будет посмотреть.</p><code id="licenseKey"></code><div class="actions"><button id="downloadConfig">Скачать для POS</button><button id="copyKey" class="primary">Скопировать</button></div></section></dialog><script type="module" src="./app.js"></script></body></html>
