name: Build macOS

# electron-builder отказывается собирать macOS на Windows/Linux, поэтому
# сборка .dmg/.zip выполняется на macOS-раннере GitHub Actions.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run dist:mac
        env:
          # Сборка без подписи: сертификата Apple Developer нет.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icashbox-macos
          retention-days: 30
          path: |
            release/*.dmg
            release/*.zip
